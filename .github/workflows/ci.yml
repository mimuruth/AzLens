name: CI

# Runs the MCP smoke test on pull requests (and pushes to main) so regressions
# are caught before the deploy workflow runs. No Azure credentials are needed —
# the smoke test only exercises the servers over stdio.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root tooling
        run: npm install --no-audit --no-fund

      - name: Run smoke test
        run: npm run smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: ESLint (MCP servers)
        run: npm run lint

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - mcp-local-coder
          - AzLens-mcp
          - mcp-personal-assistant
          - mcp-github
          - mcp-azure-cost
          - mcp-knowledge
          - mcp-postgres
          - chat-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: ${{ matrix.project }}
        run: npm install --no-audit --no-fund
      - name: Build (typecheck + compile)
        working-directory: ${{ matrix.project }}
        run: npm run build
      - name: Test
        working-directory: ${{ matrix.project }}
        run: npm test --if-present

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install chat-ui
        working-directory: chat-ui
        run: npm install --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: chat-ui
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: chat-ui
        run: npm run e2e

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build (lint infra)
        run: az bicep build --file infra/main.bicep
