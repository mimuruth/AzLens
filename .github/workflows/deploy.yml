name: Provision and Deploy MCP Servers

# Runs automatically on every push to `main`, and can also be triggered manually
# via "Run workflow" in the GitHub Actions tab. It provisions infrastructure,
# builds & pushes all three container images to ACR, and deploys them to Azure
# Container Apps. Authentication uses OIDC federation (no stored secrets).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: "Azure resource group name"
        required: true
        default: "rg-mcp"
      location:
        description: "Azure region"
        required: true
        default: "eastus"
      namePrefix:
        description: "Resource name prefix (3-11 lowercase chars)"
        required: true
        default: "mcp"

permissions:
  id-token: write # required for OIDC login
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Manual runs use the provided inputs; push-triggered runs fall back to these
    # defaults (workflow_dispatch inputs are empty on push events).
    env:
      RESOURCE_GROUP: ${{ github.event.inputs.resourceGroup || 'rg-mcp' }}
      LOCATION: ${{ github.event.inputs.location || 'eastus' }}
      NAME_PREFIX: ${{ github.event.inputs.namePrefix || 'mcp' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az group create -n "$RESOURCE_GROUP" -l "$LOCATION"

      - name: Provision infrastructure
        id: infra
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              --name mcp-infra \
              -g "$RESOURCE_GROUP" \
              -f infra/main.bicep \
              -p namePrefix="$NAME_PREFIX" \
                 azLensSubscriptionId="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            ACR_NAME=$(az deployment group show -g "$RESOURCE_GROUP" -n mcp-infra --query properties.outputs.acrName.value -o tsv)
            ACR_SERVER=$(az deployment group show -g "$RESOURCE_GROUP" -n mcp-infra --query properties.outputs.acrLoginServer.value -o tsv)
            echo "acrName=$ACR_NAME" >> "$GITHUB_OUTPUT"
            echo "acrServer=$ACR_SERVER" >> "$GITHUB_OUTPUT"

      - name: Build and push container images
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            ACR=${{ steps.infra.outputs.acrName }}
            SHA=${{ github.sha }}
            az acr build -r "$ACR" -t "mcp-local-coder:$SHA"        -t "mcp-local-coder:latest"        ./mcp-local-coder
            az acr build -r "$ACR" -t "azlens-mcp:$SHA"             -t "azlens-mcp:latest"             ./AzLens-mcp
            az acr build -r "$ACR" -t "mcp-personal-assistant:$SHA" -t "mcp-personal-assistant:latest" ./mcp-personal-assistant
            az acr build -r "$ACR" -t "mcp-github:$SHA"             -t "mcp-github:latest"             ./mcp-github
            az acr build -r "$ACR" -t "mcp-azure-cost:$SHA"         -t "mcp-azure-cost:latest"         ./mcp-azure-cost
            az acr build -r "$ACR" -t "mcp-knowledge:$SHA"          -t "mcp-knowledge:latest"          ./mcp-knowledge
            az acr build -r "$ACR" -t "mcp-postgres:$SHA"           -t "mcp-postgres:latest"           ./mcp-postgres
            az acr build -r "$ACR" -t "mcp-memory:$SHA"             -t "mcp-memory:latest"             ./mcp-memory
            az acr build -r "$ACR" -t "chat-ui:$SHA"                -t "chat-ui:latest"                ./chat-ui

      - name: Deploy container apps with built images
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            SERVER=${{ steps.infra.outputs.acrServer }}
            SHA=${{ github.sha }}
            az deployment group create \
              --name mcp-apps \
              -g "$RESOURCE_GROUP" \
              -f infra/main.bicep \
              -p namePrefix="$NAME_PREFIX" \
                 azLensSubscriptionId="${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
                 localCoderImage="$SERVER/mcp-local-coder:$SHA" \
                 azLensImage="$SERVER/azlens-mcp:$SHA" \
                 personalAssistantImage="$SERVER/mcp-personal-assistant:$SHA" \
                 githubImage="$SERVER/mcp-github:$SHA" \
                 azureCostImage="$SERVER/mcp-azure-cost:$SHA" \
                 knowledgeImage="$SERVER/mcp-knowledge:$SHA" \
                 postgresImage="$SERVER/mcp-postgres:$SHA" \
                 memoryImage="$SERVER/mcp-memory:$SHA" \
                 chatUiImage="$SERVER/chat-ui:$SHA" \
                 azureOpenAiResourceName="${{ secrets.AZURE_OPENAI_RESOURCE_NAME }}" \
                 azureOpenAiDeployment="${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
                 azureOpenAiApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
                 entraClientId="${{ secrets.ENTRA_CLIENT_ID }}" \
                 entraClientSecret="${{ secrets.ENTRA_CLIENT_SECRET }}"

            echo "## Deployed MCP endpoints" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            az deployment group show -g "$RESOURCE_GROUP" -n mcp-apps \
              --query "properties.outputs.{chatUi:chatUiUrl.value, localCoder:localCoderUrl.value, azLens:azLensUrl.value, personalAssistant:personalAssistantUrl.value}" \
              -o yaml >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
