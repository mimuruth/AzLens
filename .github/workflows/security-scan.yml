name: Container image scan

# Builds each container image and scans it with Trivy for OS/library CVEs.
# Runs on pull requests and pushes to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - mcp-local-coder
          - AzLens-mcp
          - mcp-personal-assistant
          - chat-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t azlens/${{ matrix.service }}:scan ./${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: azlens/${{ matrix.service }}:scan
          format: table
          exit-code: "0" # report only; set to "1" to fail on findings
          ignore-unfixed: true
          severity: HIGH,CRITICAL
